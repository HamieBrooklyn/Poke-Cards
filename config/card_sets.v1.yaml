# Pokémon TCG API sync plan (see https://pokemontcg.io/). Override path with CARD_SETS_CONFIG.
#
# Each top-level key adds another import layer; you can mix and match.
#   - all_sets: true  -> bulk-discover every non-excluded set the API knows about
#                        (~170+ sets) and import all of their cards. McDonald's promo
#                        sets are skipped because they duplicate other cards/art.
#   - query: "<q>"    -> Pokémon TCG `q=` filter (great for narrow imports, e.g. a
#                        national dex window or supertype).
#   - sets: [list]    -> curated set IDs to import in addition to the above.
#
# Evolution targets are resolved within each imported set; broader imports = more
# evolution branches available across the bot.

# Default: bulk-import the entire library. Generates a `/packcat`-listed pack series
# for every TCG set and gives `/packv` exhaustive search coverage.
all_sets: true

# Optional narrower override — uncomment to swap the bulk import for a Gen 1–9 slice:
# query: "nationalPokedexNumbers:[1 TO 1025]"

# Optional curated additions on top of the layers above:
# sets:
#   - sv1
#   - sv2
#   - swsh1
#   - base1
