# Pokémon TCG API set IDs to import (see https://pokemontcg.io/). Override path with CARD_SETS_CONFIG.
#
# Evolution picks targets from every imported set: if your copy’s expansion omits a branch species
# (common for Eevee), the bot falls back to another synced printing — import broadly enough that those exist.
#
# Omitted by default: sve (energy-only card faces — little value for packs/evolution gameplay).

sets:
  # Scarlet & Violet — main numbered expansions
  - sv1
  - sv2
  - sv3
  - sv4
  - sv5
  - sv6
  - sv7
  - sv8
  - sv9
  - sv10
  # SV special / subset expansions (dense Pokémon lines; includes Prismatic Evolutions, 151, etc.)
  - sv3pt5
  - sv4pt5
  - sv6pt5
  - sv8pt5
  - rsv10pt5
  - zsv10pt5
  # SV Black Star Promos (large pool — trim from this list if pulls feel too noisy)
  - svp
